# 日本語 LaTeX 環境入りベースイメージのビルド・GHCR 公開（単独実行用）です。
# main への push で Dockerfile が変わったときと、手動実行で動きます。
# アプリ側（build.yml / build-pr.yml）は同じ複合アクション
# .github/actions/build-base-images を自分の job 権限で直接実行するため、
# このワークフローを経由しません（権限要求の不整合が起きない構成）。
#
# ベースイメージのタグは Dockerfile 内容のハッシュで、内容が変わったときだけ
# 再生成されます。詳細は doc/ghcr-build.md。
name: base-images

on:
  push:
    branches: [main]
    paths:
      - server-ce/Dockerfile-base
      - Dockerfile.jp-base
      - .github/workflows/base.yml
      - .github/actions/build-base-images/action.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: base-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  base:
    runs-on: ubuntu-latest
    # TeX Live scheme-full の初回ビルドは非常に重いため余裕を持ちます。
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/build-base-images
        with:
          push_image: 'true'
