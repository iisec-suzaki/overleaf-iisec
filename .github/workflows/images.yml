# 実画像（アプリ本体・翻訳サービス・Git ブリッジ）のビルドです。
# 単独では実行せず、build.yml（push / workflow_dispatch・GHCR へ push あり）と
# build-pr.yml（pull_request・検証のみ push なし）から呼ばれます。
#
# ここで宣言する packages: write は呼び出し元の job 権限で上限制限されます。
# PR 呼び出し（packages: read）では実効権限が read になり、push/cache-to
# ステップも push_image=false でスキップされるため、PR 由来のコードは
# GHCR に書き込めません。
name: images

on:
  workflow_call:
    inputs:
      push_image:
        description: 'true のとき GHCR へ push する（PR 検証では false）'
        type: boolean
        required: true
      ja_tag:
        description: 'FROM に使う日本語ベースイメージのタグ（ja-<ハッシュ>）'
        type: string
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # GHCR の名前空間・リポジトリ名は小文字である必要があります。
  APP_IMAGE: ghcr.io/iisec-suzaki/overleaf-iisec
  TRANSLATION_IMAGE: ghcr.io/iisec-suzaki/overleaf-iisec-translation-service
  GIT_BRIDGE_IMAGE: ghcr.io/iisec-suzaki/overleaf-iisec-git-bridge
  CACHE_IMAGE: ghcr.io/iisec-suzaki/overleaf-iisec-buildcache

jobs:
  # Overleaf 本体（sharelatex）。compose.yaml の sharelatex サービスと同一の
  # Dockerfile・ビルド引数です。
  app:
    # ベース缺失（PR でベース変更）時は呼び出し元が '' を渡してスキップします。
    if: inputs.ja_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PUSH_IMAGE: ${{ inputs.push_image && 'true' || 'false' }}
      JA_BASE_RESOLVED: ghcr.io/iisec-suzaki/overleaf-iisec-ja-base:${{ inputs.ja_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # ベースイメージが private package のため、検証実行（pull）にもログインが要ります。
      # 実効権限 read の実行では読み取り以外の操作はできません。
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build app image
        run: |
          tags=(-t "$APP_IMAGE:$GITHUB_SHA")
          cache_to=()
          push=()
          if [ "$PUSH_IMAGE" = "true" ]; then
            cache_to=(--cache-to "type=registry,mode=max,image-manifest=true,oci=true,ref=$CACHE_IMAGE:app")
            push=(--push)
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              tags+=(-t "$APP_IMAGE:latest")
            fi
          fi
          docker buildx build \
            --platform linux/amd64 \
            --build-arg OVERLEAF_BASE_TAG="$JA_BASE_RESOLVED" \
            --cache-from "type=registry,ref=$CACHE_IMAGE:app" \
            "${cache_to[@]}" \
            -f server-ce/Dockerfile \
            "${tags[@]}" \
            "${push[@]}" \
            .

  # 翻訳サービス（FastAPI）。base イメージに依存しません。
  translation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUSH_IMAGE: ${{ inputs.push_image && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # 検証実行では外部イメージをプルしないためログインしません（資格情報の使用を最小化）。
      - name: Log in to GHCR
        if: inputs.push_image
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build translation-service image
        run: |
          tags=(-t "$TRANSLATION_IMAGE:$GITHUB_SHA")
          cache_to=()
          push=()
          if [ "$PUSH_IMAGE" = "true" ]; then
            cache_to=(--cache-to "type=registry,mode=max,image-manifest=true,oci=true,ref=$CACHE_IMAGE:translation")
            push=(--push)
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              tags+=(-t "$TRANSLATION_IMAGE:latest")
            fi
          fi
          docker buildx build \
            --platform linux/amd64 \
            --cache-from "type=registry,ref=$CACHE_IMAGE:translation" \
            "${cache_to[@]}" \
            "${tags[@]}" \
            "${push[@]}" \
            ./translation-service

  # Git 連携ブリッジ。base イメージに依存しません。
  git-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUSH_IMAGE: ${{ inputs.push_image && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: inputs.push_image
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build git-bridge image
        run: |
          tags=(-t "$GIT_BRIDGE_IMAGE:$GITHUB_SHA")
          cache_to=()
          push=()
          if [ "$PUSH_IMAGE" = "true" ]; then
            cache_to=(--cache-to "type=registry,mode=max,image-manifest=true,oci=true,ref=$CACHE_IMAGE:git-bridge")
            push=(--push)
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              tags+=(-t "$GIT_BRIDGE_IMAGE:latest")
            fi
          fi
          docker buildx build \
            --platform linux/amd64 \
            --cache-from "type=registry,ref=$CACHE_IMAGE:git-bridge" \
            "${cache_to[@]}" \
            -f Dockerfile.local \
            "${tags[@]}" \
            "${push[@]}" \
            ./services/git-bridge
