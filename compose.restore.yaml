# 空のvolumeへバックアップを展開する前に使う追加設定です。
# イメージ内の初期ファイルの自動コピーを止めます。復元処理自体は実行しません。
# 手順と対象データは doc/deployment-overrides.md を参照してください。
services:
  sharelatex:
    volumes:
      - type: volume
        source: overleaf_data
        target: /var/lib/overleaf
        volume:
          nocopy: true
  mongo:
    volumes:
      - type: volume
        source: mongo_data
        target: /data/db
        volume:
          nocopy: true
  redis:
    volumes:
      - type: volume
        source: redis_data
        target: /data
        volume:
          nocopy: true
  translation-service:
    volumes:
      - type: volume
        source: translation_data
        target: /data
        volume:
          nocopy: true
  git-bridge:
    volumes:
      - type: volume
        source: git_bridge_data
        target: /data/git-bridge
        volume:
          nocopy: true
